# External tool packages for repository/tools/<artifactId>/<version>/<artifactId>.zip
# artifactId must match FindArtifactUtils / BaseUpdatablePlugin lookup names.
# packagedExeName is the single executable at the root of each published zip.
#
# type=url means download a single file; type=zip means download and extract packagedExeName from inner path
#
yt-dlp.type=url
yt-dlp.version=latest
yt-dlp.url=https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe
yt-dlp.packagedExeName=yt-dlp.exe

ffmpeg.type=zip
ffmpeg.version=latest
ffmpeg.url=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
ffmpeg.innerPath=ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe
ffmpeg.packagedExeName=ffmpeg.exe

curl.type=zip
curl.version=8.20.0
curl.url=https://curl.se/windows/dl-8.20.0_2/curl-8.20.0_2-win64-mingw.zip
curl.innerPath=curl-8.20.0_2-win64-mingw/bin/curl.exe
curl.packagedExeName=curl.exe

aria2c.type=zip
aria2c.version=1.37.0
aria2c.url=https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip
aria2c.innerPath=aria2-1.37.0-win-64bit-build1/aria2c.exe
aria2c.packagedExeName=aria2c.exe

rtmpdump.type=zip
rtmpdump.version=2.3.0
rtmpdump.url=https://github.com/ShiftMediaProject/rtmpdump/archive/refs/tags/v2.3.0.zip
rtmpdump.skip=true
rtmpdump.note=No official Windows binary in upstream; publish manually or build from source.

adobeHDS.type=skip
adobeHDS.version=bundled
adobeHDS.note=Windows expects AdobeHDS.exe; only AdobeHDS.php ships in the plugin. Publish manually if needed.

rclone.type=zip
rclone.version=latest
rclone.url=https://downloads.rclone.org/rclone-current-windows-amd64.zip
rclone.innerPath=rclone-*-windows-amd64/rclone.exe
rclone.packagedExeName=rclone.exe
