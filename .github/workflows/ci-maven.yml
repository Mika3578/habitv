name: Maven CI

on:
  pull_request:
    branches:
      - develop
      - master
  push:
    branches:
      - develop
      - master
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: maven-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate-java21:
    name: validate-java21
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Temurin JDK 21
        uses: ./.github/actions/setup-build-jdk
        with:
          distribution: temurin
          java-version: "21"

      - name: Maven validate (Java 21 baseline)
        run: mvn -B -ntp -DskipTests validate

      - name: Upload Maven artifacts
        if: always()
        uses: ./.github/actions/upload-maven-artifacts
        with:
          name: validate-java21-artifacts

  deterministic-tests-java21:
    name: deterministic-tests-java21
    needs: validate-java21
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Temurin JDK 21
        uses: ./.github/actions/setup-build-jdk
        with:
          distribution: temurin
          java-version: "21"

      - name: Deterministic test subset
        run: mvn -B -ntp -pl fwk/api,fwk/framework,application/core,plugins/plugin-tester -am test

      - name: Upload Maven artifacts
        if: always()
        uses: ./.github/actions/upload-maven-artifacts
        with:
          name: deterministic-tests-java21-artifacts

  compile-and-package-java21:
    name: compile-and-package-java21
    needs: validate-java21
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Temurin JDK 21
        uses: ./.github/actions/setup-build-jdk
        with:
          distribution: temurin
          java-version: "21"

      - name: Maven package (Java 21 baseline)
        run: mvn -B -ntp -DskipTests package

      - name: Upload Maven artifacts
        if: always()
        uses: ./.github/actions/upload-maven-artifacts
        with:
          name: compile-and-package-java21-artifacts

  # Cross-platform validate signal (non-required, diagnostic). Mirrors the
  # Windows signal in build.yml so macOS regressions surface on develop PRs.
  validate-macos:
    name: validate-macos
    needs: validate-java21
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Temurin JDK 21
        uses: ./.github/actions/setup-build-jdk
        with:
          distribution: temurin
          java-version: "21"

      - name: Maven validate (macOS, Java 21)
        run: mvn -B -ntp -DskipTests validate

  # Diagnostic matrix: older JDKs cannot compile --release 21, so routine PR
  # runs only exercise the merge baseline (21). Scheduled/manual sweeps add 25.
  setup-compat:
    name: setup-compat
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.resolve.outputs.versions }}
    steps:
      - name: Resolve Java versions
        id: resolve
        run: |
          event="${GITHUB_EVENT_NAME}"
          case "$event" in
            schedule|workflow_dispatch)
              versions='["21","25"]'
              reason="Scheduled or manual run: Java 21 baseline plus next LTS preview"
              ;;
            *)
              versions='["21"]'
              reason="Routine PR/push: Java 21 merge baseline only"
              ;;
          esac
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          {
            echo "## Java compatibility matrix"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Event | \`$event\` |"
            echo "| Selected Java versions | $versions |"
            echo "| Reason | $reason |"
          } >> "$GITHUB_STEP_SUMMARY"

  compatibility-java:
    name: compatibility-java${{ matrix.java }}
    needs: setup-compat
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        java: ${{ fromJSON(needs.setup-compat.outputs.versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Temurin JDK ${{ matrix.java }}
        uses: ./.github/actions/setup-build-jdk
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Maven validate diagnostic
        run: mvn -B -ntp -DskipTests validate

      - name: Maven package diagnostic
        run: mvn -B -ntp -DskipTests package

      - name: Upload Maven artifacts
        if: always()
        uses: ./.github/actions/upload-maven-artifacts
        with:
          name: compatibility-java${{ matrix.java }}-artifacts

  full-test-suite:
    name: full-test-suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Temurin JDK 21
        uses: ./.github/actions/setup-build-jdk
        with:
          distribution: temurin
          java-version: "21"

      # Non-blocking until provider tests are migrated to offline fixtures.
      - name: Run full legacy test suite
        run: mvn -B -ntp test

      - name: Upload Maven artifacts
        if: always()
        uses: ./.github/actions/upload-maven-artifacts
        with:
          name: full-test-suite-artifacts
