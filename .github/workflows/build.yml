name: build

# Conservative baseline CI for the restart from master.
# Triggers on master and develop so the validate baseline is enforced
# on every PR aimed at either branch (HBTV-002 closure). See
# docs/audit-master-baseline.md for context.

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

permissions:
  contents: read

jobs:
  validate:
    name: validate (${{ matrix.os }}, java8)
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Maven validate
        run: mvn -B -ntp -DskipTests validate
