name: build

# Conservative baseline CI for the restart from master.
# Intentionally validate-only (no compile, no tests) to avoid masking the
# legacy reactor/plugin issues documented in docs/audit-master-baseline.md.
# Subsequent PRs (`maven-reactor`, `java8-baseline`) will widen this workflow.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Windows-only validation: the Ubuntu Java 8 validate is already covered by
  # the Maven CI workflow, so this workflow exists to add the Windows signal.
  validate:
    name: validate (windows, java8)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Temurin JDK 8
        uses: ./.github/actions/setup-build-jdk
        with:
          distribution: temurin
          java-version: '8'

      - name: Maven validate
        run: mvn -B -ntp -DskipTests validate
