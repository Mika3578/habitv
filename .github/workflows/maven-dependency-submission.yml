# Submits the full Maven dependency tree to GitHub's dependency graph
# (transitive dependencies not visible from pom.xml alone). Diagnostic and
# security-metadata only — not a merge-blocking required check.
#
# Replaces the built-in "Automatic Dependency Submission (Maven)" dynamic
# workflow once repository Settings → Dependency graph → Automatic dependency
# submission is Disabled (otherwise both may run on the same event).
name: Maven Dependency Submission

on:
  push:
    branches:
      - develop
      - master
    paths:
      - "**/pom.xml"
      - ".github/workflows/maven-dependency-submission.yml"
  pull_request:
    branches:
      - develop
      - master
    paths:
      - "**/pom.xml"
      - ".github/workflows/maven-dependency-submission.yml"
  workflow_dispatch:

# actions/maven-dependency-submission-action still declares node20; opt into
# Node 24 for action JavaScript until upstream ships a node24 runtime.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: maven-dependency-submission-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  submit-maven:
    name: submit-maven
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Liberica JDK 8
        uses: ./.github/actions/setup-build-jdk
        with:
          distribution: liberica
          java-version: "8"

      - name: Submit Maven dependency snapshot
        uses: actions/maven-dependency-submission-action@600bc1c22be12f87e10805bf74dc1633d13095ec
