name: Maven CI

on:
  pull_request:
    branches:
      - develop
      - master
  push:
    branches:
      - develop
      - master
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: maven-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate-java8:
    name: validate-java8
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Liberica JDK 8 with JavaFX
        uses: ./.github/actions/setup-build-jdk
        with:
          distribution: liberica
          java-version: "8"
          java-package: jdk+fx

      - name: Maven validate (Java 8 baseline)
        run: mvn -B -ntp -DskipTests validate

      - name: Upload Maven artifacts
        if: always()
        uses: ./.github/actions/upload-maven-artifacts
        with:
          name: validate-java8-artifacts

  deterministic-tests-java8:
    name: deterministic-tests-java8
    needs: validate-java8
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Liberica JDK 8 with JavaFX
        uses: ./.github/actions/setup-build-jdk
        with:
          distribution: liberica
          java-version: "8"
          java-package: jdk+fx

      - name: Deterministic test subset
        run: mvn -B -ntp -pl fwk/api,fwk/framework,application/core,plugins/plugin-tester -am test

      - name: Upload Maven artifacts
        if: always()
        uses: ./.github/actions/upload-maven-artifacts
        with:
          name: deterministic-tests-java8-artifacts

  compile-and-package-java8:
    name: compile-and-package-java8
    needs: validate-java8
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Liberica JDK 8 with JavaFX
        uses: ./.github/actions/setup-build-jdk
        with:
          distribution: liberica
          java-version: "8"
          java-package: jdk+fx

      - name: Maven package (Java 8 baseline)
        run: mvn -B -ntp -DskipTests package

      - name: Upload Maven artifacts
        if: always()
        uses: ./.github/actions/upload-maven-artifacts
        with:
          name: compile-and-package-java8-artifacts

  # Cross-platform validate signal (non-required, diagnostic). Mirrors the
  # Windows signal in build.yml so macOS regressions surface on develop PRs.
  # Uses Liberica JDK 8 (the project's trusted distribution; it ships macOS
  # aarch64 JDK 8, which macos-latest runners need). validate needs no JavaFX,
  # so the plain jdk package is enough. Not part of the develop merge baseline;
  # do not add to branch protection.
  validate-macos:
    name: validate-macos
    needs: validate-java8
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Liberica JDK 8
        uses: ./.github/actions/setup-build-jdk
        with:
          distribution: liberica
          java-version: "8"

      - name: Maven validate (macOS, Java 8)
        run: mvn -B -ntp -DskipTests validate

  # Resolve the compatibility matrix per event: PR/push stay on the LTS subset
  # to keep routine CI cheap; the full sweep runs only on schedule and manual
  # dispatch. These jobs are diagnostic (continue-on-error) until the JAXB and
  # JavaFX migrations land.
  setup-compat:
    name: setup-compat
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.resolve.outputs.versions }}
    steps:
      - name: Resolve Java versions
        id: resolve
        run: |
          event="${GITHUB_EVENT_NAME}"
          case "$event" in
            schedule|workflow_dispatch)
              versions='["11","17","21","25"]'
              reason="Scheduled or manual run: full compatibility sweep"
              ;;
            *)
              versions='["17","21"]'
              reason="Routine PR/push: LTS compatibility subset only"
              ;;
          esac
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          {
            echo "## Java compatibility matrix"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Event | \`$event\` |"
            echo "| Selected Java versions | $versions |"
            echo "| Reason | $reason |"
          } >> "$GITHUB_STEP_SUMMARY"

  compatibility-java:
    name: compatibility-java${{ matrix.java }}
    needs: setup-compat
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        java: ${{ fromJSON(needs.setup-compat.outputs.versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Temurin JDK ${{ matrix.java }}
        uses: ./.github/actions/setup-build-jdk
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      # Java 11+ remains diagnostic only until JAXB and JavaFX migration is complete.
      - name: Maven validate diagnostic
        run: mvn -B -ntp -DskipTests validate

      # Java 11+ package diagnostics exclude JavaFX-dependent modules until the
      # JavaFX migration is complete (trayView and habiTv directly import the
      # javafx.* packages bundled only in Liberica JDK 8 with jdk+fx).
      - name: Maven package diagnostic
        run: mvn -B -ntp -DskipTests -pl '!application/trayView,!application/habiTv' package

      - name: Upload Maven artifacts
        if: always()
        uses: ./.github/actions/upload-maven-artifacts
        with:
          name: compatibility-java${{ matrix.java }}-artifacts

  full-test-suite:
    name: full-test-suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Liberica JDK 8 with JavaFX
        uses: ./.github/actions/setup-build-jdk
        with:
          distribution: liberica
          java-version: "8"
          java-package: jdk+fx

      # Non-blocking until provider tests are migrated to offline fixtures.
      - name: Run full legacy test suite
        run: mvn -B -ntp test

      - name: Upload Maven artifacts
        if: always()
        uses: ./.github/actions/upload-maven-artifacts
        with:
          name: full-test-suite-artifacts
