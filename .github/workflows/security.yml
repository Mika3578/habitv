name: security

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - work
      - develop
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  dependency-scan:
    name: Dependency scan (OWASP)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Cache Dependency-Check data
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository/org/owasp
          key: ${{ runner.os }}-dependency-check-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-

      - name: Clear dependency-check local DB (avoid stale/corrupted cache)
        run: |
          rm -rf ~/.dependency-check

      - name: OWASP Dependency-Check (aggregate, with optional NVD API key + retry)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            echo "Dependency-Check attempt ${attempt}/3"
            if [ -n "${NVD_API_KEY}" ]; then
              echo "NVD_API_KEY detected: running dependency-check with NVD API key."
              if mvn -B -ntp \
                org.owasp:dependency-check-maven:12.2.1:aggregate \
                -Dformat=ALL \
                -DfailBuildOnCVSS=11 \
                -Dnvd.apiKey="${NVD_API_KEY}"; then
                echo "Dependency-Check succeeded on attempt ${attempt}."
                break
              fi
            else
              echo "NVD_API_KEY not set: first NVD update may be slow."
              if mvn -B -ntp \
                org.owasp:dependency-check-maven:12.2.1:aggregate \
                -Dformat=ALL \
                -DfailBuildOnCVSS=11; then
                echo "Dependency-Check succeeded on attempt ${attempt}."
                break
              fi
            fi

            if [ "${attempt}" -eq 3 ]; then
              echo "::warning::Dependency-Check failed after 3 attempts; leaving job non-blocking during bootstrap."
              exit 1
            fi

            echo "Dependency-Check failed; clearing local DB and retrying in 30s."
            rm -rf ~/.dependency-check
            sleep 30
          done

      - name: Check whether reports were generated
        if: always()
        shell: bash
        run: |
          REPORT_COUNT=$(find . -type f \( -name 'dependency-check-report.html' -o -name 'dependency-check-report.json' \) | wc -l)
          echo "Dependency-check report files found: ${REPORT_COUNT}"
          if [ "${REPORT_COUNT}" -eq 0 ]; then
            echo "::warning::No dependency-check reports were generated. Scan may have been interrupted or initial feed update may still be in progress."
          fi

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: |
            **/target/dependency-check-report.html
            **/target/dependency-check-report.json
          if-no-files-found: warn
