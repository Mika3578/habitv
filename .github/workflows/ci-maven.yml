name: Maven CI

on:
  pull_request:
    branches:
      - develop
      - master
  push:
    branches:
      - develop
      - master
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: maven-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate-java8:
    name: validate-java8
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Liberica JDK 8 with JavaFX
        uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: "8"
          java-package: jdk+fx
          cache: maven

      - name: Build tooling info
        run: |
          java -version
          mvn -version
          git status --short

      - name: Maven validate (Java 8 baseline)
        run: mvn -B -ntp -DskipTests validate

      - name: Upload Maven artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validate-java8-artifacts
          path: |
            **/target/surefire-reports/**
            **/target/*.jar
          if-no-files-found: ignore

  deterministic-tests-java8:
    name: deterministic-tests-java8
    needs: validate-java8
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Liberica JDK 8 with JavaFX
        uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: "8"
          java-package: jdk+fx
          cache: maven

      - name: Build tooling info
        run: |
          java -version
          mvn -version
          git status --short

      - name: Deterministic test subset
        run: mvn -B -ntp -pl fwk/api,fwk/framework,application/core,plugins/plugin-tester -am test

      - name: Upload Maven artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-tests-java8-artifacts
          path: |
            **/target/surefire-reports/**
            **/target/*.jar
          if-no-files-found: ignore

  compile-and-package-java8:
    name: compile-and-package-java8
    needs: validate-java8
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Liberica JDK 8 with JavaFX
        uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: "8"
          java-package: jdk+fx
          cache: maven

      - name: Build tooling info
        run: |
          java -version
          mvn -version
          git status --short

      - name: Maven package (Java 8 baseline)
        run: mvn -B -ntp -DskipTests package

      - name: Upload Maven artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-and-package-java8-artifacts
          path: |
            **/target/surefire-reports/**
            **/target/*.jar
          if-no-files-found: ignore

  # Resolve the compatibility matrix per event: PR/push stay on the LTS subset
  # to keep routine CI cheap; the full sweep runs only on schedule and manual
  # dispatch. These jobs are diagnostic (continue-on-error) until the JAXB and
  # JavaFX migrations land.
  setup-compat:
    name: setup-compat
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.resolve.outputs.versions }}
    steps:
      - name: Resolve Java versions
        id: resolve
        run: |
          case "${{ github.event_name }}" in
            schedule|workflow_dispatch)
              echo 'versions=["11","17","21","25"]' >> "$GITHUB_OUTPUT" ;;
            *)
              echo 'versions=["17","21"]' >> "$GITHUB_OUTPUT" ;;
          esac

  compatibility-java:
    name: compatibility-java${{ matrix.java }}
    needs: setup-compat
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        java: ${{ fromJSON(needs.setup-compat.outputs.versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Temurin JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build tooling info
        run: |
          java -version
          mvn -version
          git status --short

      # Java 11+ remains diagnostic only until JAXB and JavaFX migration is complete.
      - name: Maven validate diagnostic
        run: mvn -B -ntp -DskipTests validate

      # Java 11+ package diagnostics exclude JavaFX-dependent modules until the
      # JavaFX migration is complete (trayView and habiTv directly import the
      # javafx.* packages bundled only in Liberica JDK 8 with jdk+fx).
      - name: Maven package diagnostic
        run: mvn -B -ntp -DskipTests -pl '!application/trayView,!application/habiTv' package

      - name: Upload Maven artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-java${{ matrix.java }}-artifacts
          path: |
            **/target/surefire-reports/**
            **/target/*.jar
          if-no-files-found: ignore

  full-test-suite:
    name: full-test-suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Liberica JDK 8 with JavaFX
        uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: "8"
          java-package: jdk+fx
          cache: maven

      - name: Build tooling info
        run: |
          java -version
          mvn -version
          git status --short

      # Non-blocking until provider tests are migrated to offline fixtures.
      - name: Run full legacy test suite
        run: mvn -B -ntp test

      - name: Upload Maven artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-test-suite-artifacts
          path: |
            **/target/surefire-reports/**
            **/target/*.jar
          if-no-files-found: ignore
