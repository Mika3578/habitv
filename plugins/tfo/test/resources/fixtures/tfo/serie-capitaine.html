<!DOCTYPE html><html><body><div data-series-info="{&quot;serie_key&quot;: 103228938, &quot;seasons&quot;: [{&quot;model_id&quot;: 378, &quot;id&quot;: &quot;GP098184&quot;, &quot;serie_key&quot;: 103228938, &quot;name&quot;: &quot;Capitaine Tonus&quot;, &quot;slug&quot;: &quot;capitaine-tonus&quot;, &quot;description&quot;: &quot;La Capitaine Tonus est une aventurière scientifique unique en son genre.  A bord de son vaisseau, elle a la capacité de se rendre à l'intérieur d'un corps humain afin d'en observer le fonctionnement !&quot;, &quot;longDescription&quot;: &quot;La Capitaine Tonus est une aventurière scientifique unique en son genre. Une véritable Thomas Pesquet du corps humain. A bord de son vaisseau, le Positron, qui a la faculté de se réduire à la taille d'une cellule et est doté d'un surprenant matériel de pointe, Capitaine Tonus a la capacité de se\rrendre à l'intérieur d'un corps humain afin d'en observer le fonctionnement. Elle peut ainsi expliquer les règles de bonne santé... de l'intérieur ! Tonus est secondée dans ses péripéties par un compagnon original : son ordinateur de bord baptisé Neurone.\r\rDans chaque aventure, la Capitaine répond à une question posée par un enfant. Ces questions concernent les règles de bonne santé que les enfants doivent suivre et qu'ils ne comprennent pasforcément.\r\rPar exemple, pourquoi il ne faut pas manger que des aliments sucrés, pourquoi il est important de se laver les dents matin et soir ou encore pourquoi il ne faut pas regarder un écran avant de dormir.\r\rCapitaine Tonus, secondée par l'ordinateur de bord Neurone, analyse la question. Puis, grâce à la technique futuriste dont il est doté, le Positron et sa Capitaine se miniaturisent et se projettent dans un corps humain. Une fois dans la zone concernée par la question, Capitaine Tonus explique « de\rl'intérieur », scientifiquement et visuellement, le pourquoi de la règle de bonne santé&quot;, &quot;ageRange&quot;: [&quot;6 à 8 ans&quot;], &quot;rating&quot;: [
