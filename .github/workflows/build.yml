name: build

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - work
      - develop
  workflow_dispatch:

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Java ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            java: '8'
            maven_profile: ''
            maven_goal: 'validate'
          - os: windows-latest
            java: '8'
            maven_profile: ''
            maven_goal: 'validate'
          - os: ubuntu-latest
            java: '17'
            maven_profile: '-Pjava17-compat'
            maven_goal: 'test-compile'
          - os: windows-latest
            java: '17'
            maven_profile: '-Pjava17-compat'
            maven_goal: 'test-compile'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Maven validate (reactor)
        run: mvn -B -ntp -DskipTests ${{ matrix.maven_profile }} ${{ matrix.maven_goal }}
